name: SEO Blog Agent

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:

jobs:
  blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install anthropic

      - name: Run blog agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 blog_agent.py

      - name: Commit and push
        run: |
          git config user.email "agent@tylerhloans.com"
          git config user.name "Blog Agent"
          git add -A
          git diff --staged --quiet || git commit -m "Blog post $(date +%Y-%m-%d)"
          git push
