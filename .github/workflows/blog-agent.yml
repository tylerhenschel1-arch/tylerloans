name: SEO Blog Agent

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate and publish blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 blog_agent.py

      - name: Commit new blog post
        run: |
          git config --global user.email "blog-agent@tylerhloans.com"
          git config --global user.name "Blog Agent"
          git add -A
          git diff --staged --quiet || git commit -m "Blog post: $(date +%Y-%m-%d)"
          git push
