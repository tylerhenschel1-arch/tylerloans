name: Daily Blog Draft

on:
  # PAUSED — pivoting to video-first strategy. Re-enable by uncommenting.
  # schedule:
  #   - cron: '0 12 * * *'  # 7 AM Central (noon UTC)
  workflow_dispatch:
    inputs:
      day_offset:
        description: 'Day offset (0=today, 1=tomorrow, -3=three days ago).'
        required: false
        default: '0'
      topic:
        description: 'Override topic (leave blank to use rotating schedule).'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic python-docx

      - name: Pull latest before generating
        run: |
          git config user.email "blog-agent@tylerhloans.com"
          git config user.name "Blog Agent"
          git pull --rebase origin main || true

      - name: Generate blog draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: true
          DAY_OFFSET: ${{ inputs.day_offset || '0' }}
          TOPIC: ${{ inputs.topic || '' }}
        run: python blog_agent.py
